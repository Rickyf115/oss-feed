name: Update OSS Feed

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 08:00 UTC
  workflow_dispatch:        # Also allows manual trigger from the Actions tab

# Minimal permissions: only write access to repository contents is required.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run feed updater
        env:
          # Optional: GitHub PAT to raise API rate limit from 60 to 5,000 req/hr.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Optional: Slack Incoming Webhook URL for release notifications.
          # Add as a repo secret named SLACK_WEBHOOK_URL.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Optional: Discord Webhook URL for release notifications.
          # Add as a repo secret named DISCORD_WEBHOOK_URL.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run update

      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml state.json index.html
          # Only commit when there are actual changes to avoid empty commits.
          git diff --staged --quiet \
            || git commit -m "chore: update feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
