# OSS Feed watchlist — edit this file to add or remove tracked projects.
#
# Fields:
#   name                (required) Human-readable display name
#   github              (one of)   "owner/repo" slug — uses GitHub Releases API
#   feed_url            (one of)   Any HTTPS RSS 2.0 or Atom feed URL
#   tags                (optional) Labels for grouping in the weekly digest
#   include_prereleases (optional, default false) Include pre-releases (github only)
#   notes               (optional) Free-text reminder of why you're tracking this

projects:

  # ── Streaming ───────────────────────────────────────────────────────────────

  - name: "Apache Kafka"
    feed_url: "https://github.com/apache/kafka/releases.atom"
    tags: ["streaming", "backend"]
    notes: >
      kafka.apache.org returns HTTP 403 to automated requests.
      Using GitHub's native Atom feed instead — same release data.

  - name: "Warpstream Agent"
    feed_url: "https://console.warpstream.com/agent-changelog.rss"
    tags: ["streaming", "backend"]
    notes: "Warpstream Agent for warpstream control plane connectivity."

  - name: "Kafka Minion"
    github: "redpanda-data/kminion"
    tags: ["streaming", "observability"]
    notes: "Prometheus exporter for Apache Kafka"

  # ── Kubernetes core ──────────────────────────────────────────────────────────

  - name: "Kubernetes"
    github: "kubernetes/kubernetes"
    tags: ["kubernetes", "core"]

  - name: "Helm"
    github: "helm/helm"
    tags: ["kubernetes", "packaging"]

  - name: "ArgoCD"
    github: "argoproj/argo-cd"
    tags: ["kubernetes", "gitops"]

  # ── Kubernetes operators & controllers ───────────────────────────────────────

  - name: "cert-manager"
    github: "cert-manager/cert-manager"
    tags: ["kubernetes", "security"]
    notes: "TLS certificate management for Kubernetes"

  - name: "external-dns"
    github: "kubernetes-sigs/external-dns"
    tags: ["kubernetes", "networking"]
    notes: "Synchronises Kubernetes Services and Ingresses with DNS providers"

  # ── Observability ────────────────────────────────────────────────────────────

  - name: "Prometheus"
    github: "prometheus/prometheus"
    tags: ["observability", "metrics"]

  - name: "Prometheus Operator"
    github: "prometheus-operator/prometheus-operator"
    tags: ["observability", "kubernetes"]

  - name: "kube-state-metrics"
    github: "kubernetes/kube-state-metrics"
    tags: ["observability", "kubernetes"]
    notes: "Exposes Kubernetes object state as Prometheus metrics"

  - name: "Thanos"
    github: "thanos-io/thanos"
    tags: ["observability", "metrics"]
    notes: "Highly available Prometheus with long-term storage"

  - name: "Grafana Mimir"
    github: "grafana/mimir"
    tags: ["observability", "metrics"]
    notes: "Horizontally scalable long-term Prometheus storage"

  - name: "Grafana"
    github: "grafana/grafana"
    tags: ["observability", "dashboards"]
